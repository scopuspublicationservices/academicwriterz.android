plugins {
    id 'com.android.application'
}

android {
    namespace 'com.academicwriterz.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.academicwriterz.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE")
            def storePassword = System.getenv("KEYSTORE_PASSWORD")
            def keyAlias = System.getenv("KEY_ALIAS")
            def keyPassword = System.getenv("KEY_PASSWORD")

            if (keystorePath && storePassword && keyAlias && keyPassword) {
                storeFile file(keystorePath)
                storePassword storePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}

dependencies {
}