name: Build Academic Writerz Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ACADEMICWRITERZ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing keystore configured; building unsigned release."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/academicwriterz-upload.jks"

      - name: Build release AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/academicwriterz-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ACADEMICWRITERZ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ACADEMICWRITERZ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ACADEMICWRITERZ_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: academic-writerz-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/academicwriterz-upload.jks"