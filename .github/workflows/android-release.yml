name: Build Academic Writerz Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ACADEMICWRITERZ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ACADEMICWRITERZ_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/academicwriterz-upload.jks"

      - name: Validate release signing configuration
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/academicwriterz-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ACADEMICWRITERZ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ACADEMICWRITERZ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ACADEMICWRITERZ_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret for $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "The keystore, store password, or key alias is invalid."
            exit 1
          fi
          echo "Release keystore and alias validated successfully."

      - name: Build release AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/academicwriterz-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ACADEMICWRITERZ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ACADEMICWRITERZ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ACADEMICWRITERZ_KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon

      - name: Verify AAB exists
        run: test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: academic-writerz-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/academicwriterz-upload.jks"
